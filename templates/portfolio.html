<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio – StockPilot PH</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind config to match StockPilot design tokens -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#1a2744', light: '#2a3d66' },
            gold: { DEFAULT: '#d4a843', light: '#e6c16a' },
          },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          fontSize: { base: '16px' }
        }
      }
    }
  </script>

  <style>
    /* Additional inline styles for the score color bar */
    .score-bar {
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #dc2626, #f59e0b, #10b981);
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: currentColor;
      transition: width 0.3s ease;
    }
    .score-bar-fill.good { background: #10b981; }
    .score-bar-fill.average { background: #f59e0b; }
    .score-bar-fill.poor { background: #dc2626; }
    /* Sidebar active state */
    .nav-link.active {
      background-color: rgba(212, 168, 67, 0.15);
      border-left: 4px solid #d4a843;
      color: #d4a843;
    }
  </style>
</head>
<body class="font-sans text-navy bg-white antialiased">

  <!-- Layout: sidebar + main -->
  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-navy fixed h-full left-0 top-0 z-40 flex flex-col">
      <div class="flex items-center justify-center h-16 border-b border-navy-light">
        <h1 class="text-gold text-xl font-bold tracking-wider">StockPilot PH</h1>
      </div>
      <nav class="flex-1 mt-4 px-2 space-y-1">
        <a href="#" class="nav-link flex items-center px-4 py-3 text-sm font-medium rounded text-white/70 hover:bg-navy-light transition-colors">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
          Dashboard
        </a>
        <a href="#" class="nav-link active flex items-center px-4 py-3 text-sm font-medium rounded text-white/70 hover:bg-navy-light transition-colors">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Portfolio
        </a>
        <a href="#" class="nav-link flex items-center px-4 py-3 text-sm font-medium rounded text-white/70 hover:bg-navy-light transition-colors">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>
          Reports
        </a>
      </nav>
      <div class="p-4 border-t border-navy-light">
        <span class="text-xs text-white/40">v2.0</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 flex-1 p-6 lg:p-8">

      <!-- Page Header -->
      <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h2 class="text-2xl font-bold text-navy">Portfolio</h2>
          <p class="text-sm text-gray-500 mt-1">Browse, search, and sort available stocks.</p>
        </div>
        <div class="mt-4 sm:mt-0 flex items-center">
          <span id="stock-count" class="text-sm text-gray-500 mr-4"></span>
          <div class="relative">
            <input type="text" id="search-input" placeholder="Search ticker or name…" class="w-full sm:w-64 pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gold focus:border-transparent">
            <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table id="portfolio-table" class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer select-none sortable" data-column="ticker" data-order="asc">
                  <span class="flex items-center gap-1">Ticker</span>
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer select-none sortable" data-column="name" data-order="asc">
                  <span class="flex items-center gap-1">Name</span>
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer select-none sortable" data-column="score" data-order="asc">
                  <span class="flex items-center gap-1">Score</span>
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer select-none sortable" data-column="mos" data-order="asc">
                  <span class="flex items-center gap-1">MoS Signal</span>
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                  Tags
                </th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-gray-100">
              <!-- Rows populated by JavaScript -->
            </tbody>
          </table>
        </div>
        <!-- Empty state (hidden by default) -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-gray-400">
          <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <p class="text-lg font-medium">No stocks found</p>
          <p class="text-sm mt-1">Try adjusting your search query.</p>
        </div>
      </div>

    </main>
  </div>

  <script>
    /**
     * @typedef {Object} Stock
     * @property {string} ticker
     * @property {string} name
     * @property {number} score - 0 to 100
     * @property {'BUY'|'HOLD'|'SELL'|'NEUTRAL'} mos
     * @property {string[]} tags
     */

    /** @type {Stock[]} */
    const stocksData = [
      { ticker: 'AAPL', name: 'Apple Inc.', score: 88, mos: 'BUY', tags: ['Tech', 'Large Cap'] },
      { ticker: 'MSFT', name: 'Microsoft Corp.', score: 92, mos: 'BUY', tags: ['Tech', 'Cloud'] },
      { ticker: 'GOOGL', name: 'Alphabet Inc.', score: 76, mos: 'HOLD', tags: ['Tech', 'Advertising'] },
      { ticker: 'TSLA', name: 'Tesla Inc.', score: 65, mos: 'HOLD', tags: ['Auto', 'EV'] },
      { ticker: 'AMZN', name: 'Amazon.com Inc.', score: 81, mos: 'BUY', tags: ['E-Commerce', 'Cloud'] },
      { ticker: 'JPM', name: 'JP Morgan Chase', score: 73, mos: 'BUY', tags: ['Finance', 'Bank'] },
      { ticker: 'DIS', name: 'Walt Disney Co.', score: 47, mos: 'SELL', tags: ['Entertainment', 'Media'] },
      { ticker: 'NVDA', name: 'NVIDIA Corp.', score: 95, mos: 'BUY', tags: ['Tech', 'Semiconductor'] },
      { ticker: 'PYPL', name: 'PayPal Holdings', score: 54, mos: 'HOLD', tags: ['Fintech', 'Payments'] },
      { ticker: 'SBUX', name: 'Starbucks Corp.', score: 69, mos: 'HOLD', tags: ['Consumer', 'Retail'] },
      { ticker: 'NFLX', name: 'Netflix Inc.', score: 78, mos: 'BUY', tags: ['Entertainment', 'Streaming'] },
      { ticker: 'ADBE', name: 'Adobe Inc.', score: 84, mos: 'BUY', tags: ['Tech', 'Software'] },
      { ticker: 'CRM', name: 'Salesforce Inc.', score: 71, mos: 'HOLD', tags: ['Tech', 'SaaS'] },
      { ticker: 'INTC', name: 'Intel Corp.', score: 38, mos: 'SELL', tags: ['Tech', 'Semiconductor'] },
      { ticker: 'COST', name: 'Costco Wholesale', score: 91, mos: 'BUY', tags: ['Retail', 'Wholesale'] }
    ];

    let currentData = [...stocksData];
    let currentSortColumn = null;
    let currentSortOrder = 'asc';
    let searchFilter = '';

    /**
     * Returns a color class for the score bar based on the numeric value.
     * @param {number} score
     * @returns {string} Tailwind color class
     */
    function scoreBarColorClass(score) {
      if (score >= 80) return 'good';
      if (score >= 50) return 'average';
      return 'poor';
    }

    /**
     * Returns a CSS class for the MoS signal badge.
     * @param {'BUY'|'HOLD'|'SELL'|'NEUTRAL'} mos
     * @returns {string} Tailwind classes
     */
    function mosBadgeClass(mos) {
      switch (mos) {
        case 'BUY': return 'bg-green-100 text-green-800 ring-green-600/20';
        case 'HOLD': return 'bg-yellow-100 text-yellow-800 ring-yellow-600/20';
        case 'SELL': return 'bg-red-100 text-red-800 ring-red-600/20';
        default: return 'bg-gray-100 text-gray-800 ring-gray-600/20';
      }
    }

    /**
     * Creates a table row element from a Stock object.
     * @param {Stock} stock
     * @returns {HTMLTableRowElement}
     */
    function createRow(stock) {
      const tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50 transition-colors';

      // Ticker
      const tdTicker = document.createElement('td');
      tdTicker.className = 'px-6 py-4 whitespace-nowrap text-sm font-medium text-navy';
      tdTicker.textContent = stock.ticker;

      // Name
      const tdName = document.createElement('td');
      tdName.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-700';
      tdName.textContent = stock.name;

      // Score with color bar
      const tdScore = document.createElement('td');
      tdScore.className = 'px-6 py-4 whitespace-nowrap text-sm';
      const scoreValue = document.createElement('span');
      scoreValue.className = 'font-semibold text-navy';
      scoreValue.textContent = stock.score;
      const barContainer = document.createElement('div');
      barContainer.className = 'w-full max-w-[100px] mt-1';
      const bar = document.createElement('div');
      bar.className = `score-bar-fill ${scoreBarColorClass(stock.score)}`;
      bar.style.width = `${stock.score}%`;
      barContainer.appendChild(bar);
      tdScore.appendChild(scoreValue);
      tdScore.appendChild(barContainer);

      // MoS Signal
      const tdMos = document.createElement('td');
      tdMos.className = 'px-6 py-4 whitespace-nowrap text-sm';
      const badge = document.createElement('span');
      badge.className = `inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset ${mosBadgeClass(stock.mos)}`;
      badge.textContent = stock.mos;
      tdMos.appendChild(badge);

      // Tags
      const tdTags = document.createElement('td');
      tdTags.className = 'px-6 py-4 whitespace-nowrap text-sm';
      const tagContainer = document.createElement('div');
      tagContainer.className = 'flex flex-wrap gap-1';
      stock.tags.forEach(tag => {
        const tagSpan = document.createElement('span');
        tagSpan.className = 'inline-flex items-center rounded-md bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600';
        tagSpan.textContent = tag;
        tagContainer.appendChild(tagSpan);
      });
      tdTags.appendChild(tagContainer);

      tr.appendChild(tdTicker);
      tr.appendChild(tdName);
      tr.appendChild(tdScore);
      tr.appendChild(tdMos);
      tr.appendChild(tdTags);
      return tr;
    }

    /**
     * Renders the table body with the given stock array.
     * @param {Stock[]} data
     */
    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      const emptyState = document.getElementById('empty-state');
      const countSpan = document.getElementById('stock-count');

      tbody.innerHTML = '';
      if (data.length === 0) {
        emptyState.classList.remove('hidden');
        countSpan.textContent = '0 stocks';
        return;
      }
      emptyState.classList.add('hidden');
      countSpan.textContent = `${data.length} stocks`;
      data.forEach(stock => {
        const row = createRow(stock);
        tbody.appendChild(row);
      });
    }

    /**
     * Filters the master stock list by ticker or name (case-insensitive).
     * @param {string} query
     * @returns {Stock[]}
     */
    function filterStocks(query) {
      if (!query.trim()) return [...stocksData];
      const lower = query.toLowerCase();
      return stocksData.filter(s =>
        s.ticker.toLowerCase().includes(lower) ||
        s.name.toLowerCase().includes(lower)
      );
    }

    /**
     * Sorts an array of stocks in place by a given column.
     * @param {Stock[]} data
     * @param {string} column - 'ticker', 'name', 'score', 'mos'
     * @param {'asc'|'desc'} order
     * @returns {Stock[]}
     */
    function sortStocks(data, column, order) {
      const sorted = data.sort((a, b) => {
        let valA, valB;
        switch (column) {
          case 'ticker': valA = a.ticker.toUpperCase(); valB = b.ticker.toUpperCase(); break;
          case 'name': valA = a.name.toUpperCase(); valB = b.name.toUpperCase(); break;
          case 'score': valA = a.score; valB = b.score; break;
          case 'mos': valA = mosOrder(a.mos); valB = mosOrder(b.mos); break;
          default: return 0;
        }
        if (valA < valB) return order === 'asc' ? -1 : 1;
        if (valA > valB) return order === 'asc' ? 1 : -1;
        return 0;
      });
      return sorted;
    }

    /**
     * Maps MoS signal to numeric order for sorting.
     * @param {string} mos
     * @returns {number}
     */
    function mosOrder(mos) {
      const map = { 'BUY': 1, 'HOLD': 2, 'NEUTRAL': 3, 'SELL': 4 };
      return map[mos] || 99;
    }

    /**
     * Handles the sorting logic when a column header is clicked.
     * @param {Event} event
     */
    function handleSortClick(event) {
      const th = event.currentTarget;
      const column = th.dataset.column;
      let order = th.dataset.order;
      // Toggle order
      order = order === 'asc' ? 'desc' : 'asc';
      th.dataset.order = order;

      // Update visual indicator (remove from all headers, add to this)
      document.querySelectorAll('.sortable').forEach(el => {
        el.classList.remove('text-gold');
      });
      th.classList.add('text-gold');

      // Apply sorting on current data
      currentSortColumn = column;
      currentSortOrder = order;
      const filtered = filterStocks(searchFilter);
      const sorted = sortStocks(filtered, column, order);
      currentData = sorted;
      renderTable(sorted);
    }

    /**
     * Handles search input changes with debounce.
     */
    let debounceTimer = null;
    function handleSearchInput() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        try {
          const input = document.getElementById('search-input');
          searchFilter = input.value;
          const filtered = filterStocks(searchFilter);
          let result = filtered;
          if (currentSortColumn) {
            result = sortStocks(filtered, currentSortColumn, currentSortOrder);
          }
          currentData = result;
          renderTable(result);
        } catch (err) {
          console.error('Search error:', err);
        }
      }, 250);
    }

    /**
     * Initialises the page: renders the stock table and attaches event listeners.
     */
    function init() {
      try {
        // Initial render sorted by ticker ascending
        currentSortColumn = 'ticker';
        currentSortOrder = 'asc';
        const sorted = sortStocks([...stocksData], 'ticker', 'asc');
        currentData = sorted;
        renderTable(sorted);

        // Set active sort header
        const tickerHeader = document.querySelector('th[data-column="ticker"]');
        if (tickerHeader) tickerHeader.classList.add('text-gold');

        // Attach sort listeners
        document.querySelectorAll('.sortable').forEach(th => {
          th.addEventListener('click', handleSortClick);
        });

        // Attach search listener
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', handleSearchInput);
      } catch (err) {
        console.error('Initialisation error:', err);
      }
    }

    // Run when DOM is ready
    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>
</html>
