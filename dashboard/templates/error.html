{% extends "base.html" %}
{% block title %}{{ code }} Error{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center text-center" style="min-height:60vh;">
  <div class="font-black text-gray-300 leading-none" style="font-size:5rem;">{{ code }}</div>
  <div class="text-xl font-semibold mt-4 mb-2" style="color:#0D1F3C;">{{ message }}</div>
  <a href="/" class="mt-6 text-sm font-medium hover:underline" style="color:#F0A500;">← Back to Dashboard</a>
</div>
{% endblock %}
