name: CI Pre-Merge Gatekeeper

on:
  pull_request:
    branches: [main, v2-rebuild]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, v2-rebuild]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Security & Secret Exposure Gate ──────────────────────────────────────
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  # ── 2. Intelligent Path Filter ──────────────────────────────────────────────
  changes:
    name: Monorepo Path Diff Analysis
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-gatekeeper.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-gatekeeper.yml'
            docker:
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'docker-compose.yml'
              - 'railway.toml'
              - '.github/workflows/ci-gatekeeper.yml'

  # ── 3. Backend Quant & Invariant Gate ───────────────────────────────────────
  backend-gate:
    name: Backend Lint, Golden Math & Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies for C-extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt-dev libjpeg-dev zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest anyio httpx
          pip install -r requirements.txt

      - name: 🔒 CRITICAL INVARIANT GATE - Golden Math Lock (Deterministic Valuations)
        run: |
          python -m pytest tests/test_golden_math_lock.py -v --tb=short

      - name: Run Full Core & Resilience Test Suite (Excluding live network)
        run: |
          python -m pytest tests/ -v -k "not live and not e2e" --tb=short

      - name: Python Syntax & Critical Error Static Check
        run: |
          ruff check pse_quant/ --select E9,F63,F7,F82


  # ── 4. Frontend Web Portal Gate ─────────────────────────────────────────────
  frontend-gate:
    name: Frontend TypeScript, ESLint & Production Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint Code Quality Gate
        run: npx eslint . --max-warnings=100 || true

      - name: Verify Production Next.js Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # ── 5. Container Multi-Stage Build Smoke Test ──────────────────────────────
  docker-smoke:
    name: Docker Multi-Stage Container Build Smoke Test
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: stockpilot-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: stockpilot-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 6. Branch Protection Verdict (Unified Aggregator) ───────────────────────
  # This aggregator job serves as the SINGLE required check in GitHub Branch Protection rules.
  # It ensures that even if jobs are skipped due to path filtering, the pull request check
  # resolves cleanly without hanging GitHub's merge queue.
  gatekeeper-verdict:
    name: ci-gatekeeper-verdict
    needs: [secret-scan, backend-gate, frontend-gate, docker-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Gatekeeper Verdict
        run: |
          echo "=== CI Pre-Merge Gatekeeper Evaluation ==="
          FAILED=0

          check_status() {
            local name=$1
            local status=$2
            echo "Gate $name: $status"
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              FAILED=1
            fi
          }

          check_status "secret-scan" "${{ needs.secret-scan.result }}"
          check_status "backend-gate" "${{ needs.backend-gate.result }}"
          check_status "frontend-gate" "${{ needs.frontend-gate.result }}"
          check_status "docker-smoke" "${{ needs.docker-smoke.result }}"

          if [ $FAILED -ne 0 ]; then
            echo "❌ CRITICAL: One or more pre-merge gates failed! Merge blocked."
            exit 1
          fi

          echo "✅ All required checks passed or cleanly skipped. Ready to merge."
