{% extends "base.html" %}
{% block title %}Analytics{% endblock %}

{% block content %}

<div class="mb-6">
  <h1 class="text-2xl font-bold" style="color:#0D1F3C;">Analytics</h1>
  <p class="text-sm text-gray-500 mt-0.5">Revenue, membership, and score trends</p>
</div>

<div class="grid grid-cols-2 gap-4 mb-4">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
    <h2 class="text-xs font-semibold uppercase tracking-widest mb-4" style="color:#0D1F3C;">Monthly Revenue (PHP)</h2>
    <canvas id="chart-revenue" height="200"></canvas>
  </div>
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
    <h2 class="text-xs font-semibold uppercase tracking-widest mb-4" style="color:#0D1F3C;">Member Growth</h2>
    <canvas id="chart-members" height="200"></canvas>
  </div>
</div>

<div class="grid grid-cols-2 gap-4">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
    <h2 class="text-xs font-semibold uppercase tracking-widest mb-4" style="color:#0D1F3C;">Plan Distribution</h2>
    <div style="max-width:280px;margin:0 auto">
      <canvas id="chart-plans" height="200"></canvas>
    </div>
  </div>
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
    <h2 class="text-xs font-semibold uppercase tracking-widest mb-4" style="color:#0D1F3C;">Score Trends (Top Dividend Stocks)</h2>
    <canvas id="chart-scores" height="200"></canvas>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const NAVY  = '#0D1F3C';
const GREEN = '#27AE60';
const RED   = '#E74C3C';
const GOLD  = '#F0A500';
const PURP  = '#8E44AD';

function initCharts() {
  fetch('/analytics/revenue').then(r => r.json()).then(d => {
    new Chart(document.getElementById('chart-revenue'), {
      type: 'bar',
      data: {
        labels: d.labels,
        datasets: [{
          label: 'Revenue (PHP)',
          data: d.values,
          backgroundColor: GREEN + 'CC',
          borderColor: GREEN,
          borderWidth: 1,
        }]
      },
      options: {responsive: true, plugins: {legend: {display: false}}}
    });
  });

  fetch('/analytics/members').then(r => r.json()).then(d => {
    new Chart(document.getElementById('chart-members'), {
      type: 'line',
      data: {
        labels: d.labels,
        datasets: [{
          label: 'Total Members',
          data: d.values,
          borderColor: NAVY,
          backgroundColor: NAVY + '22',
          fill: true,
          tension: 0.3,
        }]
      },
      options: {responsive: true, plugins: {legend: {display: false}}}
    });
  });

  fetch('/analytics/plans').then(r => r.json()).then(d => {
    new Chart(document.getElementById('chart-plans'), {
      type: 'doughnut',
      data: {
        labels: d.labels,
        datasets: [{
          data: d.values,
          backgroundColor: [GREEN, NAVY, GOLD, RED],
        }]
      },
      options: {responsive: true}
    });
  });

  fetch('/analytics/scores').then(r => r.json()).then(d => {
    new Chart(document.getElementById('chart-scores'), {
      type: 'line',
      data: {
        labels: d.labels,
        datasets: d.datasets,
      },
      options: {
        responsive: true,
        scales: {y: {min: 0, max: 100}},
        plugins: {legend: {position: 'bottom'}},
      }
    });
  });
}

initCharts();
</script>
{% endblock %}
